# Monthly live price tracker (Phase 6). See README "Live tracker".
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   GEMINI_API_KEY  free-tier key from a Google project with NO billing, so the
#                   tracker can never incur charges. Optional: without it, new
#                   products are marked "pending" and the run still succeeds.
#   CONTACT_EMAIL   optional; sent in the scraper's User-Agent.
# Settings -> Actions -> General -> Workflow permissions must allow
# "Read and write" so the job can commit.
#
# Any failed step stops the job; the commit step only runs if every step before
# it passed, so good data is never overwritten by a broken run.

name: Live tracker

on:
  schedule:
    - cron: "0 3 1 * *"      # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: live-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-tracker.txt

      - name: Install
        run: pip install -r requirements-tracker.txt

      - name: Tests
        run: pytest -q

      - name: Month label
        run: echo "MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"

      # LLM responses are our own outputs: keep them between runs so a re-run in
      # the same month doesn't spend quota twice. Raw shop pages are NOT cached
      # or committed (third-party content); a roaster already fetched this month
      # is skipped instead, using the committed live_monthly.csv.
      - uses: actions/cache@v4
        with:
          path: data/cache/llm
          key: llm-${{ env.MONTH }}-${{ github.run_id }}
          restore-keys: llm-

      - name: Snapshot, attributes, tracker tables
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          SCRAPE_DELAY_SECONDS: "5"
          LLM_DELAY_SECONDS: "6"
        run: python -m src.tracker.run --month "$MONTH"

      - name: Historical analysis still reproduces
        run: python -m src.tracker.check_history

      - name: Only the tracker's own files changed
        run: |
          set -euo pipefail
          allowed='^(data/clean/(live_monthly|live_monthly_status|tracker_inputs|tracker_attributes)\.csv|data/review/tracker_review\.csv|outputs/tracker/.+|README\.md)$'
          changed=$(git status --porcelain --untracked-files=all | cut -c4-)
          echo "$changed"
          bad=$(echo "$changed" | grep -Ev "$allowed" | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected changes outside the tracker's files: $bad"
            exit 1
          fi

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clean/live_monthly.csv data/clean/live_monthly_status.csv \
                  data/clean/tracker_inputs.csv data/clean/tracker_attributes.csv \
                  data/review/tracker_review.csv outputs/tracker README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Live tracker: $MONTH snapshot (run $(date -u +%Y-%m-%d))"
            git push
          fi
